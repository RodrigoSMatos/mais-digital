# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Configura o tamanho da JVM usada pelo Gradle. Aumenta velocidade de build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Habilita execução em paralelo de projetos independentes
org.gradle.parallel=true

# Cache de configuração ? acelera builds incrementais
org.gradle.caching=true

# AndroidX ? OBRIGATÓRIO para projetos modernos
android.useAndroidX=true

# Migra automaticamente bibliotecas legadas para AndroidX (segurança extra)
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Habilita R class não-transitiva ? builds mais rápidos
android.nonTransitiveRClass=true

# Habilita resources não-transitivos
android.nonFinalResIds=false